[package]
name = "etilbudsavis-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async Rust client for the eTilbudsavis / Tjek mobile API"
readme = "../../README.md"
keywords = ["etilbudsavis", "tjek", "api-client", "denmark", "offers"]
categories = ["api-bindings", "web-programming::http-client"]

[lints]
workspace = true

[features]
default = ["rustls"]
# TLS via rustls and its ring provider. Disable to supply your own reqwest::Client
# through ClientBuilder::http_client, which is also how to get native-tls or a proxy.
rustls = ["reqwest/rustls-no-provider"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
directories = { workspace = true }
reqwest = { workspace = true, features = ["charset", "gzip", "http2", "json"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
wiremock = { workspace = true }
