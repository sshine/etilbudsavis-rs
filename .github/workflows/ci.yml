name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, 2026-07-16

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35, 2026-06-17

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2, 2026-01-30
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Build Nix dev shell
        run: nix develop -c true

      - name: Formatting
        run: nix develop -c just fmt-check

      - name: Clippy
        run: nix develop -c just lint

      - name: Test
        run: nix develop -c just test

      - name: Build
        run: nix develop -c just build

      - name: Documentation
        run: nix develop -c just doc

      - name: Lockfile check
        run: nix develop -c just lock-check

      - name: Package check
        run: nix develop -c just package-check

      - name: Nix packages
        run: |
          nix build .#etilbudsavis-api --no-link
          nix build .#etilbudsavis-cli --no-link
          nix build .#etilbudsavis-mcp --no-link
