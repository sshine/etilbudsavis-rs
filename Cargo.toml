[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/etilbudsavis-rs"
homepage = "https://github.com/sshine/etilbudsavis-rs"

[workspace.dependencies]
etilbudsavis-api = { version = "0.1.0", path = "crates/etilbudsavis-api" }

anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false }
clap = "4.5.51"
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false }
rmcp = "3.5.0"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
